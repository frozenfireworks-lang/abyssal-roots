name: Apply iconic avatar redesign

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-avatar-redesign.mjs'
      - '.github/workflows/apply-avatar-redesign.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v4.35 visual redesign
        run: node tools/apply-avatar-redesign.mjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README_iPhone.txt sw.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Implement v4.35 iconic tactical avatar redesign"
          git push origin HEAD:main
